name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "platform/**"
      - "shared/**"
      - "config/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]

permissions:
  id-token: write       # required for Terraform's azurerm provider to fetch its own OIDC token
  contents: read
  pull-requests: write  # required to post/update the plan comment on the PR

env:
  # Must be at least the version used locally: an older binary cannot read state
  # written by a newer one.
  TF_VERSION: "1.15.8"
  # Removes the "run terraform apply" hints, which are noise outside a terminal.
  TF_IN_AUTOMATION: "true"

jobs:
  # --- Format check: no credentials or init, runs once for the whole repo. ---

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive -diff

  # --- Dev: plan on every PR, apply automatically once merged to main ---

  plan-dev:
    needs: fmt-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    # ARM_*: azurerm fetches its own OIDC token, so no azure/login step.
    # DATABRICKS_*: a separate OIDC exchange (Databricks workload identity
    # federation), which needs a federation policy on sp-terraform-dev (Account
    # Console). DATABRICKS_HOST is a literal because the provider needs it before
    # this job's apply could output it.
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://adb-7405616518239095.15.azuredatabricks.net/
      DATABRICKS_CLIENT_ID: 5e93b219-9bc5-4a7b-8956-40d6c3648c1d # sp-terraform-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false -backend-config=../config/dev/backend.hcl
      - run: terraform validate
      - id: plan
        run: terraform plan -no-color -input=false -var-file=../config/common.tfvars -var-file=../config/dev/values.tfvars -out=tfplan -lock-timeout=5m

      - name: Check for destructive changes (any delete, same-resource replace or not)
        id: force_replace
        run: |
          # Flags any delete, whether a replace or a resource-type swap.
          DELETIONS=$(terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions | index("delete"))
            | .address
          ')
          if [ -n "$DELETIONS" ]; then
            echo "::warning::This plan destroys the following resources:"
            echo "$DELETIONS" | while read -r addr; do
              echo "::warning::  - $addr"
            done
            {
              echo "warning<<EOF"
              echo ":warning: **This plan destroys the following resources** (in place, replaced, or a resource-type change):"
              echo '```'
              echo "$DELETIONS"
              echo '```'
              echo "Review carefully before merging -- these resources will be destroyed."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No destructive changes in this plan."
          fi

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          WARNING: ${{ steps.force_replace.outputs.warning }}
        with:
          script: |
            const marker = "<!-- terraform-plan-dev -->";
            const plan = process.env.PLAN || "";
            const warning = process.env.WARNING || "";
            const body = `${marker}
            #### Terraform Plan — \`dev\` 📖

            ${warning}

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: platform/tfplan

  apply-dev:
    needs: plan-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    # Same env as plan-dev.
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://adb-7405616518239095.15.azuredatabricks.net/
      DATABRICKS_CLIENT_ID: 5e93b219-9bc5-4a7b-8956-40d6c3648c1d # sp-terraform-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false -backend-config=../config/dev/backend.hcl
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: platform
      - run: terraform apply -input=false -lock-timeout=5m tfplan

  # --- Prod: plans after dev applies; apply waits for approval on the
  # "production" GitHub Environment (required reviewer). ---

  plan-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false -backend-config=../config/prod/backend.hcl
      - run: terraform validate
      - run: terraform plan -no-color -input=false -var-file=../config/common.tfvars -var-file=../config/prod/values.tfvars -out=tfplan -lock-timeout=5m

      # Plan in the log for the apply-prod reviewer (no PR to comment on post-merge).
      - run: terraform show tfplan

      - name: Check for destructive changes (any delete, same-resource replace or not)
        run: |
          # Same check as plan-dev.
          DELETIONS=$(terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions | index("delete"))
            | .address
          ')
          if [ -n "$DELETIONS" ]; then
            echo "::warning::This plan destroys the following resources:"
            echo "$DELETIONS" | while read -r addr; do
              echo "::warning::  - $addr"
            done
            {
              echo "### :warning: Destructive change detected"
              echo ""
              echo "The following resources will be **destroyed** (in place, replaced, or a resource-type change):"
              echo '```'
              echo "$DELETIONS"
              echo '```'
              echo ""
              echo "Review carefully before approving apply-prod below -- these resources will be destroyed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No destructive changes in this plan."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: platform/tfplan

  apply-prod:
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: production   # approval gate (required reviewer)
    defaults:
      run:
        working-directory: platform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false -backend-config=../config/prod/backend.hcl
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: platform
      - run: terraform apply -input=false -lock-timeout=5m tfplan
